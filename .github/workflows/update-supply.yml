name: Update DROP Supply

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes

permissions: {}

concurrency:
  group: update-drop-supply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Require the production source branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow publishes production supply data and must run from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test bounded XRPL rate-limit retry
        run: npm run test:retry

      - name: Build supply feeds
        run: npm run build

      - name: Publish feeds to the public website
        env:
          PUBLISH_TOKEN: ${{ secrets.DROP_SUPPLY_PUBLISH_TOKEN }}
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo "::warning::DROP_SUPPLY_PUBLISH_TOKEN is not configured; the website will serve its fallback feed snapshot."
          else
            jq -n \
              --rawfile json docs/supply.json \
              --rawfile total docs/total-supply.txt \
              --rawfile circulating docs/circulating-supply.txt \
              --rawfile max docs/max-supply.txt \
              '{feeds:{"supply.json":$json,"total-supply.txt":$total,"circulating-supply.txt":$circulating,"max-supply.txt":$max}}' \
            | curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
                -X POST \
                -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                https://xrp-drop.com/supply/publish
          fi

      - name: Commit and push changes if any
        run: |
          if [[ -n "$(git status --porcelain docs/supply.json docs/total-supply.txt docs/circulating-supply.txt docs/max-supply.txt)" ]]; then
            git config user.name '$DROP'
            git config user.email 'team@xrp-drop.com'
            git add docs/supply.json docs/total-supply.txt docs/circulating-supply.txt docs/max-supply.txt
            git commit -m "chore: auto-update supply feeds"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
