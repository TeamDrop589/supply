name: Update DROP Supply

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes

permissions: {}

concurrency:
  group: update-drop-supply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build supply.json
        run: npm run build

      - name: Commit and push changes if any
        run: |
          if [[ -n "$(git status --porcelain docs/supply.json)" ]]; then
            git config user.name '$DROP'
            git config user.email 'team@xrp-drop.com'
            git add docs/supply.json
            git commit -m "chore: auto-update supply.json"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
